<!DOCTYPE html>
<html>
<head>
    <title>${title!}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        h1 { color: #333; }
        form { max-width: 500px; margin-top: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; }
        .btn-primary { background-color: #2196F3; color: white; }
        .btn-secondary { background-color: #757575; color: white; }
        a { text-decoration: none; }
    </style>
</head>
<body>
    <a href="/db-demo/student-list" class="btn btn-secondary">返回列表</a>

    <h1>${title!}</h1>

    <form action="/db-demo/student-save" method="POST">
        <#if student??>
            <input type="hidden" name="id" value="${student.id!}">
        </#if>

        <div class="form-group">
            <label>姓名：</label>
            <input type="text" name="name" value="${student.name!}" required>
        </div>

        <div class="form-group">
            <label>身高：</label>
            <input type="number" step="0.1" name="height" value="${student.height!}">
        </div>

        <div class="form-group">
            <label>体重：</label>
            <input type="number" step="0.1" name="weight" value="${student.weight!}">
        </div>

        <button type="submit" class="btn btn-primary">保存</button>
        <a href="/db-demo/student-list" class="btn btn-secondary">取消</a>
    </form>
</body>
</html>
