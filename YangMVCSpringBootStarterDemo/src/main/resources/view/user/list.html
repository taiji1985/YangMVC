<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .toolbar {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #764ba2;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 15px 30px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #495057;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-info {
            background: #17a2b8;
            color: white;
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        .stats {
            padding: 15px 30px;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👥 ${title}</h1>
            <p>用户管理系统演示</p>
        </div>

        <div class="stats">
            共 ${total} 位用户
        </div>

        <div class="toolbar">
            <div>
                <span style="color: #6c757d;">操作提示：</span>
                <span style="color: #495057;">点击按钮管理用户信息</span>
            </div>
            <div>
                <a href="/user/add" class="btn btn-primary">➕ 添加用户</a>
                <a href="/hello/index" class="btn btn-secondary">← 返回首页</a>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>姓名</th>
                    <th>邮箱</th>
                    <th>年龄</th>
                    <th>城市</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <#list users as user>
                <tr>
                    <td><span class="badge badge-info">${user.id}</span></td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>${user.age}</td>
                    <td>${user.city}</td>
                    <td class="actions">
                        <a href="/user/view?id=${user.id}" class="btn btn-sm btn-primary">查看</a>
                        <a href="/user/edit?id=${user.id}" class="btn btn-sm btn-primary">编辑</a>
                        <a href="#" onclick="deleteUser(${user.id}, '${user.name}')" class="btn btn-sm btn-secondary" style="background: #dc3545;">删除</a>
                    </td>
                </tr>
                </#list>
            </tbody>
        </table>
    </div>

    <script>
        function deleteUser(id, name) {
            if (confirm('确定要删除用户 "' + name + '" 吗？')) {
                fetch('/user/delete?id=' + id, {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        alert('删除成功');
                        location.reload();
                    } else {
                        alert('删除失败: ' + data.message);
                    }
                })
                .catch(error => {
                    alert('删除失败: ' + error);
                });
            }
        }
    </script>
</body>
</html>
