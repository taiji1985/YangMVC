server:
  port: 8080

# YangMVC配置
yangmvc:
  controller: org.docshare.yangmvc.demo.controller  # 控制器包名
  template: /view                                    # 模板目录 - YangMVC classpath默认路径
  reloadable: false                                  # 关闭热加载以避免类加载器问题
  encoding: utf-8

# Spring数据源配置
spring:
  datasource:
    # 使用H2内存数据库（Demo环境）
    url: jdbc:h2:mem:demodb
    driver-class-name: org.h2.Driver
    username: sa
    password:

    # 如果要使用MySQL，取消下面的注释并注释掉上面的H2配置
    #url: jdbc:mysql://localhost:3306/yangmvc_demo?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    #driver-class-name: com.mysql.cj.jdbc.Driver
    #username: root
    #password: your_password

  # H2控制台（可选）
  h2:
    console:
      enabled: true
      path: /h2-console

  # DevTools配置
  devtools:
    restart:
      enabled: true  # 启用自动重启
    livereload:
      enabled: true  # 启用浏览器自动刷新

# 日志配置
logging:
  level:
    root: INFO
    org.docshare: DEBUG
    org.docshare.yangmvc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
