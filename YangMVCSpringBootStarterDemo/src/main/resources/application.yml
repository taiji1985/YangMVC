server:
  port: 8080

# YangMVC配置
yangmvc:
  controller: org.docshare.yangmvc.demo.controller  # 控制器包名
  template: /view                                    # 模板目录 - YangMVC classpath默认路径
  reloadable: false                                  # 关闭热加载以避免类加载器问题
  encoding: utf-8

# Spring数据源配置
spring:
  datasource:
    # 使用MySQL数据库
    url: jdbc:mysql://localhost:3309/teach?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

    # H2配置（已禁用）
    #url: jdbc:h2:mem:demodb
    #driver-class-name: org.h2.Driver
    #username: sa
    #password:

  # H2控制台（已禁用）
  h2:
    console:
      enabled: false

  # DevTools配置
  devtools:
    restart:
      enabled: true  # 启用自动重启
    livereload:
      enabled: true  # 启用浏览器自动刷新

# 日志配置
logging:
  level:
    root: INFO
    org.docshare: DEBUG
    org.docshare.yangmvc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
