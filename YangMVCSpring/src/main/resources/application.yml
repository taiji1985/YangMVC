
server:

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3309/teach?useSSL=false&serverTimezone=GMT%2B8&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    root: INFO
    YangMVC: DEBUG
    org.springframework.boot.autoconfigure.logging.ConditionReportLoggingListener: ERROR

# YangMVC简化配置 - 使用HashMap方式
yangmvc:
  config:
    # 基本配置
    controller: org.demo
    template: /view
    
    # 数据库配置
    dbhost: localhost
    dbusr: root
    dbpwd: root
    dbname: teach
    dbport: 3309
    dbtype: mysql
    dbschema: public
    dbEncoding: utf8
    useSSL:  false
    
    # 系统配置
    encoding: utf-8
    pageEncoding: utf-8
    dateFormat: yyyy-MM-dd HH:mm:ss
    reloadable: "true"
    reload_config: "false"
    
